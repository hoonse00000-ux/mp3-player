<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>내 음악 플레이어</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#14110f">
<meta name="color-scheme" content="only dark">
<meta name="supported-color-schemes" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="내 음악">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{color-scheme:only dark;
  --bg:#14110f; --panel:#1f1a17; --panel2:#2a2420; --line:#3a322c;
  --text:#f3ece6; --muted:#a3968b; --accent:#ff7a45; --accent2:#ffb347; --danger:#ff5b5b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
html,body{overflow-x:hidden;margin:0;background:var(--bg);color:var(--text);font-family:'Noto Sans KR',system-ui,sans-serif}
body{min-height:100vh;padding-bottom:210px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit}
header{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 80%,transparent);padding:18px 18px 6px}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.acct{padding:7px 14px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-size:13px;font-weight:700}
.acct.in{width:36px;height:36px;padding:0;border:0;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#1a0d06;font-size:15px;font-weight:900}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:4px;margin-bottom:14px}
.seg button{flex:1;padding:9px;border-radius:9px;font-size:14px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--panel2);color:var(--text)}
.stack{display:flex;flex-direction:column;gap:8px}
.err{color:var(--danger);font-size:13px;min-height:18px;margin:8px 2px 0}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;margin:16px 0}
.or:before,.or:after{content:'';flex:1;height:1px;background:var(--line)}
.btn.full{width:100%;justify-content:center;padding:13px}
.btn.light{background:var(--text);color:var(--bg);font-weight:700}
.linkbtn{color:var(--muted);font-size:13px;text-decoration:underline;margin-top:12px}
.profile{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.profile .acct.in{width:52px;height:52px;font-size:22px;flex-shrink:0;display:grid;place-items:center;border-radius:50%}
h1{margin:0;font-size:26px;font-weight:900;letter-spacing:-.5px}
h1 span{color:var(--accent)}
.tabs{display:flex;gap:8px}
.tab{padding:8px 16px;border-radius:999px;background:var(--panel);color:var(--muted);font-weight:500;font-size:14px}
.tab.on{background:var(--text);color:var(--bg)}
main{padding:8px 14px}
.toolbar{display:flex;gap:8px;margin:8px 0 12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 14px;border-radius:12px;background:var(--panel2);font-size:14px;font-weight:500}
.btn.primary{background:var(--accent);color:#1a0d06;font-weight:700}
.btn:active{transform:scale(.97)}
.empty{text-align:center;color:var(--muted);padding:40px 16px;border:1.5px dashed var(--line);border-radius:16px;line-height:1.7;font-size:14px}
.row{display:flex;align-items:center;gap:10px;padding:10px 8px;border-radius:12px}
.row:active{background:var(--panel)}
.row.playing{background:var(--panel)}
.row.playing .name{color:var(--accent)}
.num{width:24px;text-align:center;color:var(--muted);font-size:13px;flex-shrink:0}
.info{flex:1;min-width:0}
.name{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:12px;color:var(--muted);margin-top:2px}
.ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--muted);flex-shrink:0;font-size:18px}
.ic:active{background:var(--panel2)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}.thumb .ico-s{width:22px;height:22px}
.thumb{width:44px;height:44px;border-radius:10px;overflow:hidden;background:linear-gradient(135deg,#3b2a20,#251c16);display:grid;place-items:center;color:var(--accent);flex-shrink:0;position:relative;font-size:18px}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb-eq{position:absolute;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center}
.pthumb{width:48px;height:48px;position:relative}
.handle{width:28px;height:44px;margin-right:-4px;color:var(--muted);font-size:20px;touch-action:none;flex-shrink:0;cursor:grab}
.row.dragging{background:var(--panel2);position:relative;z-index:3;box-shadow:0 10px 28px rgba(0,0,0,.55);transition:none}
.search{margin:0 0 8px;padding:11px 14px}
.chip svg{width:14px;height:14px;fill:currentColor;display:block;flex-shrink:0}
.prog{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:14px 0 8px}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .2s}
.vstat{font-size:13px;color:var(--muted);min-height:18px}
.act-item .ico-s{width:20px;height:20px;flex-shrink:0}
.ihead{display:flex;align-items:center;gap:14px;margin:2px 0 14px}
.ihead .thumb{width:64px;height:64px;border-radius:14px;font-size:26px;cursor:default}
.ihead .it-title,.ihead .it-artist{text-align:left;margin:0}
.ihead .it-title{font-size:18px}
.lyrics{max-height:46vh;overflow-y:auto;overflow-x:hidden;overflow-wrap:anywhere;touch-action:pan-y;overscroll-behavior-x:none;text-align:center;font-size:16px;line-height:1.9;white-space:pre-wrap;word-break:keep-all;padding:6px 4px 10px;-webkit-overflow-scrolling:touch}
.lline{max-width:100%;transform-origin:center;padding:3px 6px;border-radius:8px;color:var(--muted);transition:color .25s,transform .25s;cursor:pointer}
.lline.on{color:var(--text);font-weight:700}
.nolyr{text-align:center;color:var(--muted);padding:44px 0 30px;font-size:15px}
.lyr-edit{min-height:44vh;resize:vertical;line-height:1.7;font-family:inherit}
.seg3 button{font-size:13px}
.inschips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;-webkit-overflow-scrolling:touch}
.inschips button{flex-shrink:0;padding:8px 13px;border-radius:999px;background:var(--panel2);font-size:13px;font-weight:700;color:var(--muted);border:1.5px solid transparent}
.inschips button.on{border-color:var(--accent);color:var(--accent)}
.notebig{background:var(--bg);border-radius:16px;padding:14px 12px 12px;text-align:center;margin-bottom:12px}
.notebig .nm{font-size:44px;font-weight:900;line-height:1.1;color:var(--accent2);min-height:50px}
.notebig .nsub{font-size:13px;color:var(--muted);margin-top:4px;min-height:18px}
.notebig .npos{font-size:15px;font-weight:700;margin-top:6px;min-height:20px}
.notebig .nnext{font-size:13px;color:var(--muted);margin-top:8px;min-height:18px}
.kbd{width:100%;max-width:330px;height:auto;margin:10px auto 0;display:block}
.score{max-height:52vh;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;background:var(--bg);border-radius:14px;padding:4px 6px;-webkit-overflow-scrolling:touch}
.srow{display:block;width:100%;height:auto;border-bottom:1px dashed #2c2520}
.srow:last-child{border-bottom:0}
.srow .sl{stroke:#5b4d43;stroke-width:1.4}
.srow .lg{stroke:#5b4d43;stroke-width:1.4}
.srow .tm{fill:var(--muted);font-size:15px}
.srow .st{fill:var(--text);font-size:23px;font-weight:700;text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:var(--bg);stroke-width:7px;stroke-linejoin:round;cursor:pointer}
.srow .st.on{fill:#1a0d06;stroke:var(--accent);font-weight:900}
.srow .st.past{fill:var(--accent2)}
.srow .nb{fill:var(--accent);opacity:0;transition:opacity .12s}
.srow .nb.on{opacity:1}
.srow .sb{fill:var(--muted);font-size:15px;text-anchor:middle;font-weight:700}
.srow .sb.on{fill:var(--accent)}
.srow .sb.past{fill:#b8853a}
.srow .clef{fill:none;stroke:var(--text);stroke-width:2.6;stroke-linecap:round}
.srow .tsig{fill:var(--text);font-size:27px;font-weight:900;text-anchor:middle}
.srow .bl{stroke:#7a6a5e;stroke-width:1.6}.srow .bl2{stroke:#7a6a5e;stroke-width:4.5}
.srow .ng{cursor:pointer}
.srow .hd,.srow .flag,.srow .dot{fill:var(--text)}
.srow .hdo{fill:none;stroke:var(--text);stroke-width:2.3}
.srow .stem{stroke:var(--text);stroke-width:1.8}
.srow .tie{fill:none;stroke:var(--text);stroke-width:1.6}
.srow .acc{fill:var(--text);font-size:19px;text-anchor:middle}
.srow .rest{fill:#b5a79b}.srow .rests{fill:none;stroke:#b5a79b;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
.srow .ng.past .hd,.srow .ng.past .flag,.srow .ng.past .dot,.srow .ng.past .acc{fill:var(--accent2)}
.srow .ng.past .hdo{stroke:var(--accent2)}.srow .ng.past .stem,.srow .ng.past .tie{stroke:var(--accent2)}
.srow .ng.past .st{fill:var(--accent2)}.srow .ng.past .sb{fill:#b8853a}
.srow .ng.on .hd,.srow .ng.on .flag,.srow .ng.on .dot,.srow .ng.on .acc{fill:var(--accent)}
.srow .ng.on .hdo{stroke:var(--accent);fill:rgba(255,122,69,.35)}.srow .ng.on .stem,.srow .ng.on .tie{stroke:var(--accent)}
.srow .ng.on .st{fill:var(--accent);font-size:26px;font-weight:900}.srow .ng.on .sb{fill:var(--accent)}
.srow .ph{stroke:var(--accent);stroke-width:3;stroke-linecap:round;opacity:0}
.srow .ph.show{opacity:.85}
.srow .od{fill:var(--text)}
.nseq{max-height:30vh;overflow:auto;padding:2px 0;-webkit-overflow-scrolling:touch}
.nline{display:flex;flex-wrap:wrap;gap:4px;padding:5px 0;border-bottom:1px solid var(--line)}
.nline .lt{width:40px;font-size:11px;color:var(--muted);padding-top:6px;flex-shrink:0}
.nt{position:relative;padding:5px 7px 7px;border-radius:8px;background:var(--panel2);font-size:14px;font-weight:700;cursor:pointer;line-height:1}
.nt.on{background:var(--accent);color:#1a0d06}
.nt.hi::before,.nt.hi2::before{content:'';position:absolute;top:1px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:currentColor}
.nt.hi2::after{content:'';position:absolute;top:1px;left:50%;width:4px;height:4px;margin-left:4px;border-radius:50%;background:currentColor}
.nt.lo::after{content:'';position:absolute;bottom:1px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:currentColor}
.ai-opts{display:flex;flex-direction:column;gap:12px;margin:6px 0 4px}
.ai-opts label{font-size:13px;color:var(--muted);display:block;margin-bottom:6px}
.plcard{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:var(--panel);margin-bottom:8px}
.cover{width:48px;height:48px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-size:22px;color:#1a0d06;flex-shrink:0}
.dethead{display:flex;align-items:center;gap:8px;margin:4px 0 6px}
.dethead h2{margin:0;font-size:20px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:14px}
.eq i{width:3px;background:var(--accent);animation:eq .9s infinite ease-in-out}
.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}
.paused .eq i{animation-play-state:paused}
@keyframes eq{0%,100%{height:3px}50%{height:14px}}

/* player */
#player{position:fixed;left:0;right:0;bottom:0;z-index:10;background:rgba(31,26,23,.97);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:10px 16px 16px;border-radius:20px 20px 0 0}
.ptop{display:flex;align-items:center;gap:10px;position:relative}
#viz{position:absolute;inset:0;width:100%;height:100%;opacity:.35;pointer-events:none}
.ptitle{flex:1;min-width:0;position:relative;cursor:pointer}
.pthumb{cursor:pointer}
.bigart{width:min(240px,62vw);aspect-ratio:1;margin:4px auto 16px;border-radius:18px;overflow:hidden;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-size:72px;color:#1a0d06;box-shadow:0 14px 40px rgba(0,0,0,.5)}
.bigart img{width:100%;height:100%;object-fit:cover;display:block}
.it-title{text-align:center;font-size:20px;font-weight:900;margin:0 0 4px;word-break:keep-all}
.it-artist{text-align:center;color:var(--accent2);font-size:15px;margin:0 0 16px}
.it-table{width:100%;border-collapse:collapse;font-size:14px;margin-bottom:6px}
.it-table td{padding:9px 2px;border-bottom:1px solid var(--line);vertical-align:top}
.it-table td:first-child{color:var(--muted);width:92px;white-space:nowrap}
.it-table td:last-child{word-break:break-all}
.ptitle .name{font-size:16px;font-weight:700}
.chip{position:relative;display:inline-flex;align-items:center;gap:4px;line-height:1;padding:7px 11px;border-radius:999px;background:var(--panel2);font-size:12px;font-weight:700;color:var(--accent2);border:1px solid var(--line)}
.chip.on{background:var(--accent2);color:#1a0d06}
.seek{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);margin:8px 0 4px;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:4px;background:var(--line);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--text)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--text);border:0}
.ctrls{display:flex;align-items:center;justify-content:space-between;max-width:420px;margin:0 auto}
.cb{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;position:relative;transition:transform .08s}
.cb:active{transform:scale(.9)}
.cb svg{pointer-events:none}
.cb svg{width:24px;height:24px;fill:currentColor}
.cb.small svg{width:20px;height:20px}
.cb.off{color:var(--muted)}
.cb.act{color:var(--accent)}
.cb .badge{position:absolute;top:8px;right:6px;font-size:9px;font-weight:900;background:var(--accent);color:#1a0d06;border-radius:6px;padding:0 3px;line-height:13px}
.play{width:66px;height:66px;background:var(--text);color:var(--bg)}
.play svg{width:28px;height:28px}
.ico-s{fill:none!important;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.btn .ico-s{width:17px;height:17px;stroke-width:2.4}
.modelabel{text-align:center;font-size:11px;color:var(--muted);height:14px;margin-top:2px}

/* sheet */
#mask{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:none}
#mask.show{display:block}
#sheet{overflow-x:hidden;overscroll-behavior-x:none;position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--panel);border-radius:22px 22px 0 0;padding:8px 18px 24px;max-height:82vh;overflow:auto;transform:translateY(105%);transition:transform .22s ease}
#sheet.show{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 12px}
.sheet-title{font-size:17px;font-weight:700;margin:0 0 12px}
.act-item{display:flex;align-items:center;gap:12px;width:100%;padding:14px 6px;font-size:15px;border-bottom:1px solid var(--line);text-align:left}
.act-item:last-child{border:0}
.act-item.danger{color:var(--danger)}
.field{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:16px;outline:none}
.field:focus{border-color:var(--accent)}
.sheet-btns{display:flex;gap:8px;margin-top:14px}
.sheet-btns .btn{flex:1;justify-content:center}
.chk{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);font-size:15px}
.chk input{width:20px;height:20px;accent-color:var(--accent)}
.chk span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.presets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.preset{padding:12px 6px;border-radius:12px;background:var(--panel2);font-size:13px;font-weight:700;text-align:center;border:1.5px solid transparent}
.preset.on{border-color:var(--accent);color:var(--accent)}
.preset small{display:block;font-weight:400;color:var(--muted);font-size:11px;margin-top:2px}
.slider{margin:14px 0}
.slider label{display:flex;justify-content:space-between;font-size:14px;margin-bottom:8px}
.slider label b{color:var(--accent2);font-variant-numeric:tabular-nums}
.toggle{display:flex;justify-content:space-between;align-items:center;font-size:14px;margin:14px 0}
.note{font-size:12px;color:var(--muted);line-height:1.6}
#updBar{position:fixed;left:50%;top:max(12px,env(safe-area-inset-top));transform:translateX(-50%);z-index:35;background:var(--accent2);color:#1a0d06;padding:9px 10px 9px 16px;border-radius:999px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:10px;box-shadow:0 6px 20px rgba(0,0,0,.4);white-space:nowrap}
#updBar button{background:#1a0d06;color:var(--accent2);border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px}
#toast{position:fixed;left:50%;bottom:220px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:13px;font-weight:500;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}
#drop{position:fixed;inset:0;z-index:40;background:rgba(255,122,69,.15);border:3px dashed var(--accent);display:none;place-items:center;font-size:20px;font-weight:700}
#drop.show{display:grid}
.warn{background:#3a2016;color:#ffc9a8;border-radius:12px;padding:10px 12px;font-size:12px;margin:0 0 10px;line-height:1.5}
</style>
</head>
<body>
<header>
  <div class="hrow"><h1>내 음악<span>.</span></h1><button class="acct" id="acctBtn">로그인</button></div>
  <div class="tabs">
    <button class="tab on" data-tab="library">전체 곡</button>
    <button class="tab" data-tab="playlists">플레이리스트</button>
  </div>
</header>
<main id="main"></main>

<input type="file" id="fileIn" accept="audio/mpeg,audio/mp3,.mp3,audio/*" multiple hidden>
<input type="file" id="videoIn" accept="video/*,.mp4,.mov,.m4v,.webm,.mkv" multiple hidden>
<audio id="audio" preload="metadata"></audio>

<section id="player">
  <div class="ptop">
    <canvas id="viz"></canvas>
    <div class="thumb pthumb" id="pArt"><svg class="ico-s" viewBox="0 0 24 24"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg></div>
    <div class="ptitle">
      <div class="name" id="pName">재생 중인 곡 없음</div>
      <div class="sub" id="pSub">곡을 눌러 재생하세요</div>
    </div>
    <button class="chip" id="sleepBtn" aria-label="잠자기 타이머"><svg viewBox="0 0 24 24"><path d="M20.5 14.6A8.5 8.5 0 0 1 9.4 3.5a8.5 8.5 0 1 0 11.1 11.1z"/></svg><span id="sleepTxt"></span></button>
    <button class="chip" id="remixBtn"><svg class="mix" viewBox="0 0 24 24"><path d="M6 3v6.4M6 14.6V21M12 3v2.4M12 10.6V21M18 3v10.4M18 18.6V21" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><circle cx="6" cy="12" r="2.6"/><circle cx="12" cy="8" r="2.6"/><circle cx="18" cy="16" r="2.6"/></svg> 리믹스</button>
  </div>
  <div class="seek">

function enableDrag(box, onDone) {
  box.querySelectorAll('.handle').forEach(h => h.addEventListener('pointerdown', e => {
    e.preventDefault();
    const row = h.closest('.row'), rows = () => [...box.querySelectorAll('.row[data-idx]')];
    const from = rows().indexOf(row);
    let startY = e.clientY;
    try { h.setPointerCapture(e.pointerId); } catch {}
    row.classList.add('dragging');
    const move = ev => {
      const y = ev.clientY, list = rows(), i = list.indexOf(row);
      const nx = list[i + 1], pv = list[i - 1];
      if (nx) { const rc = nx.getBoundingClientRect(); if (y > rc.top + rc.height / 2) { box.insertBefore(nx, row); startY += rc.height; } }
      if (pv) { const rc = pv.getBoundingClientRect(); if (y < rc.top + rc.height / 2) { box.insertBefore(row, pv); startY -= rc.height; } }
      row.style.transform = `translateY(${y - startY}px)`;
    };
    const up = () => {
      h.removeEventListener('pointermove', move); h.removeEventListener('pointerup', up); h.removeEventListener('pointercancel', up);
      row.classList.remove('dragging'); row.style.transform = '';
      const to = rows().indexOf(row);
      if (to !== from) onDone(from, to);
    };
    h.addEventListener('pointermove', move); h.addEventListener('pointerup', up); h.addEventListener('pointercancel', up);
  }));
}

let sleepAt = null, sleepEnd = false, sleepTick = null, fading = false;
function sleepLabel() {
  if (sleepEnd) return '곡 끝';
  if (!sleepAt) return '';
  const left = Math.max(0, sleepAt - Date.now()), m = Math.floor(left / 60000), sec = Math.floor(left / 1000) % 60;
  return m >= 1 ? m + 1 + '분' : sec + '초';
}
function setSleep(v) {
  clearInterval(sleepTick); sleepAt = null; sleepEnd = false;
  if (v === 'end') sleepEnd = true;
  else if (v > 0) { sleepAt = Date.now() + v * 60000; sleepTick = setInterval(checkSleep, 1000); }
  updateModes();
}
function checkSleep() {
  if (!sleepAt) return;
  if (Date.now() >= sleepAt) { sleepAt = null; clearInterval(sleepTick); fadeOutPause(); }
  updateModes();
}
audio.addEventListener('timeupdate', checkSleep);   // 화면이 꺼져 있어도 확인
function fadeOutPause() {

  fading = true; const v0 = audio.volume; let k = 0;
  const t = setInterval(() => {
    k++; audio.volume = Math.max(0, v0 * (1 - k / 20));
    if (k >= 20) { clearInterval(t); userPaused = true; audio.pause(); audio.volume = v0; fading = false; toast('잠자기 타이머로 재생을 멈췄어요'); }
  }, 150);
}

const PRESETS = {
  orig:    { label: '원본',        sub: '효과 없음',      speed: 1,    keepPitch: true,  bass: 0,  reverb: 0,   echo: 0 },
  night:   { label: '나이트코어',  sub: '빠르고 높게',    speed: 1.25, keepPitch: false, bass: 0,  reverb: 0,   echo: 0 },
  slowed:  { label: '슬로우+리버브', sub: '느리고 몽환적', speed: 0.85, keepPitch: false, bass: 4,  reverb: 0.55, echo: 0 },
  bass:    { label: '베이스 부스트', sub: '저음 쿵쿵',     speed: 1,    keepPitch: true,  bass: 12, reverb: 0,   echo: 0 },
  echo:    { label: '에코',        sub: '메아리',         speed: 1,    keepPitch: true,  bass: 2,  reverb: 0.15, echo: 0.45 },
  hall:    { label: '콘서트홀',    sub: '넓은 공간감',    speed: 1,    keepPitch: true,  bass: 2,  reverb: 0.7, echo: 0 }
};
let ctx = null, srcNode, bassF, master, conv, wetG, delayN, fbG, echoG, analyser;
function impulse(sec, decay) {
  const rate = ctx.sampleRate, len = rate * sec, buf = ctx.createBuffer(2, len, rate);
  for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay); }
  return buf;
}
// 베이스·리버브·에코를 쓸 때만 Web Audio를 연결 (그 외에는 오디오 태그로 직접 재생해 백그라운드 재생이 끊기지 않게)

function initAudio() {
  if (ctx) return;

    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    ctx = new AC();
    srcNode = ctx.createMediaElementSource(audio);
    bassF = ctx.createBiquadFilter(); bassF.type = 'lowshelf'; bassF.frequency.value = 180;
    master = ctx.createGain();
    conv = ctx.createConvolver(); conv.buffer = impulse(3, 2.5);
    wetG = ctx.createGain();
    delayN = ctx.createDelay(1.5); delayN.delayTime.value = 0.32;
    fbG = ctx.createGain(); fbG.gain.value = 0.42;
    echoG = ctx.createGain();
    analyser = ctx.createAnalyser(); analyser.fftSize = 128;
    srcNode.connect(bassF);
    bassF.connect(master);
    bassF.connect(conv); conv.connect(wetG); wetG.connect(master);
    bassF.connect(delayN); delayN.connect(fbG); fbG.connect(delayN); delayN.connect(echoG); echoG.connect(master);
    master.connect(analyser); analyser.connect(ctx.destination);
    ctx.onstatechange = wake;

  } catch (e) { ctx = null; }
}

  audio.defaultPlaybackRate = fx.speed; audio.playbackRate = fx.speed;

  if (ctx) {
    const t = ctx.currentTime;
    bassF.gain.setTargetAtTime(fx.bass, t, 0.05);
    wetG.gain.setTargetAtTime(fx.reverb * 1.2, t, 0.05);
    echoG.gain.setTargetAtTime(fx.echo, t, 0.05);
    master.gain.setTargetAtTime(1 / (1 + fx.reverb * 0.5 + fx.echo * 0.4 + fx.bass / 30), t, 0.05);
  }
  LS.set('fx', fx); saveState();
  updateModes();
}

function drawViz() {
  const cv = $('#viz'), g = cv.getContext('2d'), data = new Uint8Array(analyser.frequencyBinCount);
  const loop = () => {
    requestAnimationFrame(loop);
    const w = cv.clientWidth, h = cv.clientHeight;
    if (cv.width !== w * 2) { cv.width = w * 2; cv.height = h * 2; }
    g.clearRect(0, 0, cv.width, cv.height);
    if (audio.paused) return;
    analyser.getByteFrequencyData(data);
    const n = 40, bw = cv.width / n;
    for (let i = 0; i < n; i++) {
      const v = data[Math.floor(i * data.length / n * 0.8)] / 255, bh = v * cv.height;
      g.fillStyle = `hsl(${20 + v * 20},100%,${55 + v * 10}%)`;
      g.fillRect(i * bw + 1, cv.height - bh, bw - 3, bh);
    }
  };
  loop();
}

async function markBroken(s) {
  if (!s || !s.hasAudio) return;
  // 잠깐의 읽기 오류로 잘못 표시하지 않도록, 저장소에 정말 없는지 한 번 더 확인
  let rec;
  try { rec = await getOne('audio', s.id); } catch { return; }
  if (rec && rec.data && rec.data.byteLength) { blobCache.delete(s.id); return; }
  s.hasAudio = false; s.broken = true; put('songs', s).catch(() => {}); softRender();
}
// 파일 이름으로 곡 짝 맞추기 (다시 연결할 때)
const normName = n => (n || '').replace(/\.[^.]+$/, '').replace(/\s*\[[A-Za-z0-9_-]{11}\]\s*$/, '').replace(/[_\s]+/g, ' ').trim().toLowerCase();
function matchLostSong(f, pool) {
  const n = normName(f.name);
  return pool.find(s => normName(s.file) === n) || pool.find(s => normName(s.name) === n)
    || pool.find(s => s.size && s.size === f.size);
}
async function attachFile(s, f) {
  const blob = new Blob([await f.arrayBuffer()], { type: f.type || 'audio/mpeg' });
  try { await putAudio(s.id, blob); } catch { db = null; await putAudio(s.id, blob); }
  blobCache.delete(s.id);
  const back = await getOne('audio', s.id);                     // 제대로 저장됐는지 바로 다시 읽어서 확인
  if (!back || !back.data || back.data.byteLength !== blob.size) throw new Error('verify');
  s.hasAudio = true; s.broken = false; s.size = f.size;
  if (!s.file) s.file = f.name;
  if (!s.dur) { try { s.dur = await getDuration(await getBlob(s)); } catch {} }
  await put('songs', s);
  if (!s.thumb) queueArt(s, true);
}
// 여러 곡을 한 번에 골라 자동으로 다시 연결
function relinkMany() {
  if (!songs.some(x => !x.hasAudio)) return toast('다시 연결할 곡이 없어요');
  const inp = document.createElement('input');
  inp.type = 'file'; inp.multiple = true; inp.accept = 'audio/mpeg,audio/mp3,.mp3,audio/*';
  inp.onchange = async () => {
    let ok = 0, skip = 0;
    const pool = songs.filter(x => !x.hasAudio);
    for (const f of inp.files) {
      const s = matchLostSong(f, pool);
      if (!s) { skip++; continue; }
      try { await attachFile(s, f); ok++; pool.splice(pool.indexOf(s), 1); } catch { skip++; }
    }
    render();
    toast(`${ok}곡을 다시 연결했어요${skip ? ` · 짝을 못 찾은 파일 ${skip}개` : ''}${pool.length ? ` · 남은 곡 ${pool.length}개` : ''}`);
  };
  inp.click();
}
// 파일을 잃어버린 곡에 MP3를 다시 연결 (이름·가사·계이름·플레이리스트는 그대로)
function relinkSong(s) {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'audio/mpeg,audio/mp3,.mp3,audio/*';
  inp.onchange = async () => {
    const f = inp.files && inp.files[0]; if (!f) return;
    try { await attachFile(s, f); render(); toast('파일을 다시 연결했어요'); }
    catch { toast('파일을 연결하지 못했어요. 다시 해 주세요'); }
  };
  inp.click();
}

/* ---------- 예전 저장 방식(Blob) → 새 방식(원본 데이터)으로 옮기기 ---------- */
let migrated = false;
async function migrateSongs() {
  let moved = 0, lost = 0, healed = 0;
  for (const s of songs) {
    if (s.artData && !(s.art instanceof Blob)) { s.art = new Blob([s.artData], { type: s.artType || 'image/jpeg' }); artAB.set(s.art, s.artData); }
    delete s.artData; delete s.artType;
    if (s.blob instanceof Blob) {                                // 예전 방식으로 저장된 곡
      try { await putAudio(s.id, s.blob); s.hasAudio = true; s.broken = false; moved++; }
      catch { s.hasAudio = false; s.broken = true; lost++; }
      if (s.art instanceof Blob && !artAB.get(s.art)) { try { artAB.set(s.art, await s.art.arrayBuffer()); } catch { delete s.art; } }
      delete s.blob;
      await put('songs', s).catch(() => {});
    } else if (s.hasAudio === undefined) {
      s.hasAudio = !!(await getOne('audio', s.id).catch(() => null)); if (!s.hasAudio) s.broken = true;
    } else if (!s.hasAudio) {                                   // 예전에 잘못 '다시 연결 필요'로 표시된 곡 되살리기
      const rec = await getOne('audio', s.id).catch(() => null);
      if (rec && rec.data && rec.data.byteLength) { s.hasAudio = true; s.broken = false; healed++; await put('songs', s).catch(() => {}); }
    }
  }
  // 시작할 때 파일이 정말 없는 곡을 미리 찾아 두기 (한 번에 다시 연결할 수 있게)
  try {
    const keys = new Set(await new Promise((res, rej) => { const q = db.transaction('audio').objectStore('audio').getAllKeys(); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }));
    for (const s of songs) if (s.hasAudio && !keys.has(s.id)) { s.hasAudio = false; s.broken = true; lost++; await put('songs', s).catch(() => {}); }
  } catch {}
  migrated = true;
  if (healed) setTimeout(() => toast(`${healed}곡을 다시 찾았어요`), 1200);
  if (lost) setTimeout(() => toast(`${lost}곡의 파일을 기기가 잃어버렸어요. 위쪽 '파일 다시 연결' 버튼으로 한 번에 복구할 수 있어요`), 1500);
  else if (moved) setTimeout(() => toast('곡 파일을 더 안전한 방식으로 옮겼어요'), 1500);
}

/* ---------- 재생 기록 저장 / 복원 ---------- */
let restoring = false, lastSave = 0, pendingTime = null;
function snapshot() {
  return { id: 'state', saved: Date.now(), queue, order, pos, queueSrc, curId,
    time: pendingTime ?? (audio.currentTime || 0), tab, openPl, repeat, shuffle, fx, volume: audio.volume };
}
function saveState() {
  if (restoring) return;
  const st = snapshot();
  LS.set('state', st);
  put('kv', st).catch(() => {});
}
audio.addEventListener('timeupdate', () => { if (Date.now() - lastSave > 3000) { lastSave = Date.now(); saveState(); } });
audio.addEventListener('pause', saveState);
audio.addEventListener('seeked', saveState);
document.addEventListener('visibilitychange', () => { if (document.hidden) saveState(); });
addEventListener('pagehide', saveState);
addEventListener('beforeunload', saveState);

async function restoreState() {
  let a = LS.get('state', null), b = null;
  try { b = await getOne('kv', 'state'); } catch {}
  const st = [a, b].filter(Boolean).sort((x, y) => (y.saved || 0) - (x.saved || 0))[0];
  if (!st) return;
  restoring = true;
  try {
    if (st.repeat) repeat = st.repeat;
    if (typeof st.shuffle === 'boolean') shuffle = st.shuffle;
    if (st.fx) fx = Object.assign(fx, st.fx);
    tab = st.tab === 'playlists' ? 'playlists' : 'library';
    openPl = tab === 'playlists' && plById(st.openPl) ? st.openPl : null;
    document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x.dataset.tab === tab));
    const s = songById(st.curId);
    if (s && Array.isArray(st.queue)) {
      queueSrc = st.queueSrc === 'lib' || plById(st.queueSrc) ? st.queueSrc : 'lib';
      const ok = st.queue.every(id => songById(id)) && Array.isArray(st.order) && st.order.length === st.queue.length;
      if (ok) { queue = st.queue; order = st.order; pos = Math.max(0, Math.min(st.pos, order.length - 1)); }
      else { queue = st.queue.filter(id => songById(id)); buildOrder(Math.max(0, queue.indexOf(s.id))); }
      if (queue[order[pos]] !== s.id) { const ci = queue.indexOf(s.id); if (ci < 0) { queue.push(s.id); order.push(queue.length - 1); pos = order.length - 1; } else pos = order.indexOf(ci); }
      curId = s.id;
      try { if (s.hasAudio) { const b = await getBlob(s); curUrl = URL.createObjectURL(b); audio.src = curUrl; } } catch { markBroken(s); }
      const t = +st.time || 0; pendingTime = t;
      audio.addEventListener('loadedmetadata', () => {
        if (t > 0 && t < audio.duration - 1) audio.currentTime = t;
        pendingTime = null;
        $('#tCur').textContent = fmt(audio.currentTime);
        $('#seek').value = audio.duration ? audio.currentTime / audio.duration * 1000 : 0;
      }, { once: true });
      if (typeof st.volume === 'number') audio.volume = st.volume;
      applyFx();
      updateNow();
      toast('이어서 듣기: ' + s.name);
    }
  } catch (e) {}
  restoring = false;
}

/* ---------- 확대·복사 막기 ---------- */
const isField = t => t && t.closest && t.closest('input,textarea');
['gesturestart', 'gesturechange'].forEach(ev => document.addEventListener(ev, e => e.preventDefault(), { passive: false }));
document.addEventListener('dblclick', e => { if (!isField(e.target)) e.preventDefault(); });
['copy', 'cut', 'contextmenu', 'selectstart', 'dragstart'].forEach(ev => document.addEventListener(ev, e => { if (!isField(e.target)) e.preventDefault(); }));

/* ---------- 백그라운드 재생 지키기 ---------- */
// 아이폰·아이패드: 이 앱 소리를 '재생' 용도로 알려서 다른 앱으로 가도 계속 나오게
try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch {}
// 다른 앱에 가 있는 동안에는 분석·받아쓰기 같은 무거운 일을 멈춤 (기기가 앱을 강제로 끄지 않게)
const waitVisible = () => document.hidden ? new Promise(r => { const f = () => { if (!document.hidden) { document.removeEventListener('visibilitychange', f); r(); } }; document.addEventListener('visibilitychange', f); }) : Promise.resolve();
const idle = () => document.hidden ? waitVisible() : new Promise(r => setTimeout(r, 0));
// 사용자가 직접 멈춘 게 아닌데 멈추면(다른 앱으로 갈 때 브라우저가 멈춤) 다시 재생
// 다른 영상·통화 등이 소리를 가져가면 멈추고, 그게 끝나면 같은 자리부터 이어서 재생
let userPaused = false, bgInterrupted = false;
const AS = navigator.audioSession;                         // 아이폰·아이패드 사파리: 다른 소리에 끊겼는지 알려 줌
const otherAudio = () => !!(AS && AS.state === 'interrupted');
function resumeIfInterrupted() {
  if (bgInterrupted && audio.paused && !userPaused && curId && !otherAudio()) audio.play().catch(() => {});
}
audio.addEventListener('play', () => { userPaused = false; bgInterrupted = false; });
audio.addEventListener('pause', () => {
  if (userPaused || audio.ended || !curId) return;
  bgInterrupted = true;                                    // 내가 멈춘 게 아님 → 나중에 이어서 재생
  // 다른 소리 때문이 아니라 브라우저가 그냥 멈춘 거면(앱 전환 등) 바로 다시 재생.
  // 다른 영상이 소리를 가져간 경우엔 그 영상을 방해하지 않도록 기다림
  if (AS && AS.state && AS.state !== 'interrupted') setTimeout(() => { if (!otherAudio()) resumeIfInterrupted(); }, 600);
});
// 다른 영상이 끝나서 소리를 돌려받으면 이어서 재생
try { if (AS && 'onstatechange' in AS) AS.addEventListener('statechange', () => { if (AS.state !== 'interrupted') setTimeout(resumeIfInterrupted, 500); }); } catch {}
// 이 앱으로 돌아오면 이어서 재생
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) resumeIfInterrupted();
  if (document.hidden && !audio.paused && 'mediaSession' in navigator) { try { navigator.mediaSession.playbackState = 'playing'; } catch {} }
});
addEventListener('focus', resumeIfInterrupted);
addEventListener('pageshow', resumeIfInterrupted);

/* ---------- 오프라인 실행 (서비스 워커) ---------- */
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').then(reg => { swReg = reg; }).catch(() => {}));
}
/* ---------- 새 버전 자동 반영 (홈 화면 앱도 껐다 켤 필요 없이) ---------- */
let swReg = null, pendingVersion = null;
function applyUpdate() {
  if (!pendingVersion) return;
  LS.set('reloadedFor', pendingVersion);
  saveState();
  if (swReg && swReg.waiting) swReg.waiting.postMessage('skipWaiting');
  location.reload();
}
function showUpdateBanner() {
  if (document.getElementById('updBar')) return;
  const bar = document.createElement('div');
  bar.id = 'updBar';
  bar.innerHTML = '새 버전이 준비됐어요 <button>지금 적용</button>';
  bar.querySelector('button').onclick = applyUpdate;
  document.body.appendChild(bar);
}
async function checkUpdate() {
  if (!navigator.onLine || (location.protocol !== 'https:' && location.hostname !== 'localhost')) return;
  try {
    if (swReg) swReg.update().catch(() => {});
    const r = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) return;
    const v = String((await r.json()).v || '');
    if (!v || v === window.APP_VERSION) return;
    if (!migrated) return;                                   // 곡 정리 중에는 새로고침하지 않음
    if (LS.get('reloadedFor', '') === v) return;           // 이미 한 번 새로고침했는데도 같으면 반복하지 않음
    pendingVersion = v;
    if (audio.paused && !document.hidden && !aiCur && !melodyJob) applyUpdate();   // 음악이 멈춰 있으면 바로 적용
    else showUpdateBanner();                                                    // 재생 중이면 알림만
  } catch {}
}
audio.addEventListener('pause', () => { if (pendingVersion && userPaused && !document.hidden) setTimeout(() => { if (audio.paused) applyUpdate(); }, 800); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkUpdate(); });
setInterval(() => { if (!document.hidden) checkUpdate(); }, 3 * 60 * 1000);
setTimeout(checkUpdate, 4000);

/* ---------- 시작 ---------- */
(async () => {
  try { db = await openDB(); } catch { db = null; }
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch {}
  try {
    songs = (await all('songs')).sort((a, b) => a.added - b.added);
    await migrateSongs();
    playlists = (await all('playlists')).sort((a, b) => a.created - b.created);
  } catch { db = null; songs = []; playlists = []; }
  migrated = true;
  $('#shuffleBtn').innerHTML = SHUF;
  await restoreState();
  localReadyResolve();
  if (aiCrashed) toast(aiDisabled() ? '이 기기는 메모리가 부족해 가사 자동 받아쓰기를 껐어요' : '가사 AI가 메모리를 너무 써서 앱이 멈췄어요. 더 가벼운 방식으로 다시 해 볼게요');
  setTimeout(() => songs.forEach(x => queueArt(x)), 1500);   // 썸네일 없는 곡 고치기
  resumeLyrics(aiCrashed ? 30000 : 10000);   // 앱이 다 열린 뒤 천천히 시작
  resumeMelody(5000);
  renderAccount();
  upgradeOldSongs();
  setPlayIcon(); updateModes(); render();
})();
})();
</script>
<script type="module">
const cfg = window.FIREBASE_CONFIG;
const status = s => { window.FB_STATUS = s; dispatchEvent(new CustomEvent('fb-status', { detail: s })); };
if (!cfg) status('noconfig');
else {
  try {
    const V = '10.12.2';
    const { initializeApp } = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
    const A = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`);
    const app = initializeApp(cfg);
    const auth = A.getAuth(app);
    auth.languageCode = 'ko';
    await A.setPersistence(auth, A.browserLocalPersistence);   // 앱을 닫아도 로그인 유지
    const google = new A.GoogleAuthProvider();
    window.FB = {
      app, auth,
      async google() {
        try { return await A.signInWithPopup(auth, google); }
        catch (e) {
          if (['auth/popup-blocked', 'auth/operation-not-supported-in-this-environment'].includes(e.code)) return A.signInWithRedirect(auth, google);
          throw e;
        }
      },
      signIn: (e, p) => A.signInWithEmailAndPassword(auth, e, p),
      async signUp(e, p, name) { const c = await A.createUserWithEmailAndPassword(auth, e, p); if (name) await A.updateProfile(c.user, { displayName: name }); return c; },
      reset: e => A.sendPasswordResetEmail(auth, e),
      signOut: () => A.signOut(auth)
    };
    A.getRedirectResult(auth).catch(() => {});
    status('ready');
    A.onAuthStateChanged(auth, u => dispatchEvent(new CustomEvent('fb-user', { detail: u })));
  } catch (e) { console.error(e); status('error'); }
}
</script>
